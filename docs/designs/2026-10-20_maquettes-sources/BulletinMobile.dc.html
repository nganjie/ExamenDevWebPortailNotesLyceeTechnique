<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bulletin sur téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #F5F7FB; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; gap: 10px; align-items: center">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px">AN</span>
      <span style="display: flex; flex-direction: column; line-height: 1.25">
        <span style="font-weight: 600; font-size: 15px">NGO BASSA Aline</span>
        <span style="font-size: 12px; color: #475569">LT24-F3-0017 · 2e année F3</span>
      </span>
    </span>
    <button type="button" aria-label="Se déconnecter" style="width: 44px; height: 44px; border: 1px solid #E2E8F0; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5M21 12H9"></path></svg>
    </button>
  </header>

  <main style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 24px">Séquence 2</h1>
      <label for="m-seq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Choisir la séquence</label>
      <select id="m-seq" style="height: 44px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: Inter, sans-serif; color: #0F172A">
        <option>Séquence 1</option>
        <option selected="selected">Séquence 2</option>
      </select>
    </div>

    <section style="background: {{primary}}; color: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; opacity: 0.9">Moyenne coefficientée</span>
          <span style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 44px; line-height: 1">12,98<span style="font-size: 17px; opacity: 0.85"> / 20</span></span>
        </div>
        <span style="padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.18); font-size: 13px; font-weight: 600">Assez bien</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.25)">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; opacity: 0.85">Rang</span><span style="font-weight: 700; font-size: 18px">7e / 30</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; opacity: 0.85">Classe</span><span style="font-weight: 700; font-size: 18px">10,92</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; opacity: 0.85">Séq. 1</span><span style="font-weight: 700; font-size: 18px">12,04</span></div>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden">
      <h2 style="margin: 0; padding: 14px 16px; font-family: Manrope, sans-serif; font-size: 17px; font-weight: 800; border-bottom: 1px solid #E2E8F0">Notes par matière</h2>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{lignes}}" as="l" hint-placeholder-count="8">
          <li style="padding: 12px 16px; border-top: 1px solid #EEF2F7; display: flex; justify-content: space-between; align-items: center; gap: 12px">
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-weight: 600; font-size: 15px">{{l.matiere}}</span>
              <span style="font-size: 12px; color: #475569">Coef. {{l.coef}} · classe {{l.classe}}</span>
            </span>
            <span style="min-width: 58px; text-align: center; padding: 6px 8px; border-radius: 8px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; background: {{l.fond}}; color: {{l.couleur}}">{{l.note}}</span>
          </li>
        </sc-for>
      </ul>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: Manrope, sans-serif; font-size: 17px; font-weight: 800">Évolution</h2>
      <svg viewBox="0 0 340 150" width="100%" role="img" aria-label="Élève : 12,04 puis 12,98 ; classe : 10,61 puis 10,92" style="display: block; font-family: Inter, sans-serif">
        <g stroke="#EEF2F7"><line x1="30" y1="15" x2="335" y2="15"></line><line x1="30" y1="55" x2="335" y2="55"></line><line x1="30" y1="135" x2="335" y2="135"></line></g>
        <line x1="30" y1="95" x2="335" y2="95" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"></line>
        <g fill="#475569" font-size="11" text-anchor="end"><text x="24" y="19">16</text><text x="24" y="59">13</text><text x="24" y="99">10</text><text x="24" y="139">7</text></g>
        <g fill="#475569" font-size="11" text-anchor="middle"><text x="55" y="149">S1</text><text x="110" y="149">S2</text><text x="165" y="149">S3</text><text x="220" y="149">S4</text><text x="275" y="149">S5</text><text x="325" y="149">S6</text></g>
        <polyline points="55,86.9 110,82.7" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"></polyline>
        <polyline points="55,67.5 110,55" fill="none" stroke="{{primary}}" stroke-width="3" stroke-linecap="round"></polyline>
        <circle cx="55" cy="67.5" r="5" fill="#FFFFFF" stroke="{{primary}}" stroke-width="3"></circle>
        <circle cx="110" cy="55" r="5" fill="#FFFFFF" stroke="{{primary}}" stroke-width="3"></circle>
        <circle cx="55" cy="86.9" r="4" fill="#94A3B8"></circle>
        <circle cx="110" cy="82.7" r="4" fill="#94A3B8"></circle>
      </svg>
      <div style="display: flex; gap: 14px; font-size: 12px; color: #334155">
        <span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 4px; border-radius: 2px; background: {{primary}}"></span>Élève</span>
        <span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 4px; border-radius: 2px; background: #94A3B8"></span>Classe</span>
        <span style="display: flex; gap: 6px; align-items: center"><span style="width: 12px; height: 0; border-top: 2px dashed #B45309"></span>Seuil 10</span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#7C3AED"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = this.props.primary ?? '#1D4ED8';
    const brut = [
      ['Électrotechnique', 5, 15, 12.6],
      ['Mathématiques', 4, 13.5, 10.8],
      ['Technologie', 4, 12, 11.2],
      ['Sciences physiques', 3, 11, 9.9],
      ['Dessin technique', 3, 12.5, 11.7],
      ['Français', 2, 10, 10.4],
      ['Anglais', 2, 14, 11.9],
      ['Éducation physique', 1, 16, 14.1],
    ];
    const fr = (v) => v.toFixed(2).replace('.', ',');
    const lignes = brut.map(([matiere, coef, note, classe]) => ({
      matiere,
      coef,
      note: fr(note),
      classe: fr(classe - 0.5175),
      fond: note < 10 ? '#FEE2E2' : '#E8EEFD',
      couleur: note < 10 ? '#B91C1C' : '#1E3A8A',
    }));
    return { primary, lignes };
  }
}
</script>
</body>
</html>
