<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion élève sur téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7FB; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; gap: 10px; align-items: center">
      <span style="width: 36px; height: 36px; border-radius: 9px; background: {{primary}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c3 2 9 2 12 0v-5"></path></svg>
      </span>
      <span style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 16px">Portail de notes</span>
    </span>
    <button type="button" aria-label="Ouvrir le menu" style="width: 44px; height: 44px; border: 1px solid #E2E8F0; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
  </header>

  <main style="flex: 1; padding: 28px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">Consulter un bulletin</h1>
      <p style="margin: 0; font-size: 15px; color: #475569; line-height: 1.5">Matricule et code personnel de l'élève.</p>
    </div>

    <div role="tablist" aria-label="Type de compte" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9EDF3; border-radius: 10px">
      <button type="button" role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 8px; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 15px; font-family: Inter, sans-serif; box-shadow: 0 1px 3px rgba(15,23,42,0.12)">Élève / parent</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: #475569; font-weight: 500; font-size: 15px; font-family: Inter, sans-serif">Enseignant</button>
    </div>

    <form style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-matricule" style="font-weight: 600; font-size: 14px">Matricule</label>
        <input id="m-matricule" name="matricule" type="text" value="LT24-F3-17" aria-invalid="true" aria-describedby="m-erreur" style="height: 50px; padding: 0 14px; border: 2px solid #B91C1C; border-radius: 10px; font-size: 16px; font-family: Inter, sans-serif; color: #0F172A; background: #FFFFFF">
        <span id="m-erreur" style="display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: #B91C1C; line-height: 1.4">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
          Format attendu : LT24-F3-0017 (4 chiffres à la fin).
        </span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-code" style="font-weight: 600; font-size: 14px">Code d'accès personnel</label>
        <input id="m-code" name="code" type="password" value="123456" inputmode="numeric" style="height: 50px; padding: 0 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 16px; font-family: Inter, sans-serif; color: #0F172A; background: #FFFFFF">
      </div>
      <button type="submit" style="height: 52px; border: 0; border-radius: 10px; background: {{primary}}; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: Inter, sans-serif">Voir le bulletin</button>
    </form>

    <div style="display: flex; gap: 12px; padding: 14px; border-radius: 12px; background: #FEF3C7; color: #78350F; font-size: 14px; line-height: 1.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span>Chaque élève ne voit que son propre bulletin. Ne communiquez pas votre code.</span>
    </div>
  </main>

  <footer style="padding: 16px; text-align: center; font-size: 13px; color: #475569">© 2026 Lycée technique [NOM DU LYCÉE]</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#1D4ED8","options":["#1D4ED8","#0F766E","#7C3AED"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { primary: this.props.primary ?? '#1D4ED8' };
  }
}
</script>
</body>
</html>
